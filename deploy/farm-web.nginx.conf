server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2 application/wasm;

    add_header Content-Security-Policy "frame-ancestors 'self' http://localhost:8080 http://localhost:8000 https://erp.clevacredit.com https://*.cleva.rw;" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Support escape hatch for stuck service workers (mirrors POS).
    location = /sw-reset {
        default_type text/html;
        return 200 '<!doctype html><meta charset=utf-8><title>SW reset</title><script>Promise.all([(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations()||[]).then(r=>Promise.all(r.map(x=>x.unregister()))),caches&&caches.keys().then(k=>Promise.all(k.map(c=>caches.delete(c))))]).then(()=>{location.replace("/")}).catch(()=>{location.replace("/")});</script>Clearing…';
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~* \.(?:js|css|png|svg|ico|woff2|webmanifest)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files /index.html =404;
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
